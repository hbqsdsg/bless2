<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>给蒙东阳的生日惊喜</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#090714;color:#fff}
button{font:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:2;width:100%;height:100%}
.page{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px;animation:fade .55s ease}
.page.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.box{width:min(92vw,440px);padding:30px 22px;border:1px solid #ffffff20;background:rgba(255,255,255,.07);border-radius:28px;backdrop-filter:blur(14px);box-shadow:0 20px 70px #0009}
.title{font-size:28px;line-height:1.5;margin:0 0 28px}
.sub{color:#bdb8ce;font-size:14px;line-height:1.8}
.choice{width:100%;margin:10px 0;padding:15px 18px;border:1px solid #e8c87566;border-radius:999px;background:#ffffff0f;color:#ffe8a6;box-shadow:0 8px 30px #0004}
.choice:active{transform:scale(.96)}
.stopTitle{font-size:36px;margin:0 0 15px;color:#ffcfda}
.stopText{color:#d5cfdc;line-height:2}
.gift{width:180px;height:145px;position:relative;margin:20px auto 28px;cursor:pointer;filter:drop-shadow(0 18px 25px #0008);animation:giftFloat 2s ease-in-out infinite}
@keyframes giftFloat{50%{transform:translateY(-8px)}}
.giftBase{position:absolute;left:12px;right:12px;bottom:5px;height:100px;background:linear-gradient(135deg,#d92956,#8e153d);border-radius:10px 10px 18px 18px}
.giftLid{position:absolute;left:0;right:0;top:28px;height:38px;background:linear-gradient(135deg,#ef4065,#a71b46);border-radius:10px;z-index:3}
.ribbonV{position:absolute;left:72px;top:0;width:36px;height:145px;background:#f6d56c;z-index:4}
.ribbonH{position:absolute;left:0;right:0;top:38px;height:18px;background:#f6d56c;z-index:5}
.bowL,.bowR{position:absolute;top:0;width:48px;height:28px;background:#f6d56c;z-index:6;border-radius:50% 50% 10% 50%;transform:rotate(-28deg);left:42px}
.bowR{left:90px;transform:rotate(28deg);border-radius:50% 50% 50% 10%}
.giftText{font-size:22px;color:#ffe5a0;font-weight:700;margin-bottom:12px}
.reveal{font-size:30px;font-weight:800;color:#ffd873;line-height:1.6;margin:0 0 20px}
.slow{opacity:0;animation:slowShow 2.8s ease forwards}
@keyframes slowShow{to{opacity:1}}
.delayBtn{opacity:0;animation:slowShow 2.8s 1.2s ease forwards}
.scrollPage{justify-content:flex-start;overflow-y:auto;padding-top:55px;padding-bottom:60px;touch-action:pan-y}
.scrollPage::-webkit-scrollbar{display:none}
.birthday{font-size:42px;color:#ffd96e;text-shadow:0 0 28px #ffcf55aa;margin:20px 0}
.wheelWrap{position:relative;width:min(86vw,350px);height:min(86vw,350px);margin:22px auto 30px}
#wheel{width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 0 0 5px #f6d77c55,0 18px 60px #000b;transition:transform 1.6s cubic-bezier(.12,.78,.15,1)}
.pointer{position:absolute;z-index:5;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:28px solid #fff2a5;filter:drop-shadow(0 4px 5px #000)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:#25152b;border:3px solid #f8da78;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#ffe7a0;font-weight:800;box-shadow:0 0 25px #0008;z-index:4}
.center b{font-size:27px}
.center small{font-size:11px;margin-top:4px;color:#d9c58e}
.spinBtn{padding:15px 42px;border:0;border-radius:999px;background:linear-gradient(135deg,#ffd96e,#e89c42);color:#3a1c13;font-weight:800;box-shadow:0 10px 30px #d99b3b55}
.spinBtn:disabled{opacity:.45}
.prize{width:min(92vw,430px);padding:24px 20px;border-radius:26px;background:#ffffff0f;border:1px solid #ffffff1f}
.luckybag{width:150px;height:130px;margin:10px auto 18px;position:relative;display:flex;align-items:center;justify-content:center;font-size:58px}
.bagBody{width:130px;height:105px;background:linear-gradient(145deg,#e64062,#9d173d);border-radius:28px 28px 35px 35px;box-shadow:inset 0 0 25px #ffb04a33,0 15px 35px #0008;display:flex;align-items:center;justify-content:center}
.bagTop{position:absolute;top:5px;width:75px;height:28px;border-radius:50%;border:8px solid #f4d36d;background:#d92956}
.prize h2{color:#ffd970;margin:6px 0 14px;font-size:27px}
.prize p{line-height:1.9;margin:0;color:#f3eef7;font-size:17px}
.hint{color:#aaa2b4;font-size:13px;margin-top:20px}
.spark{position:fixed;z-index:8;pointer-events:none;font-size:22px;animation:spark 1.2s ease forwards}
@keyframes spark{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.5) rotate(180deg)}}

/* ===== 蛋糕页 ===== */
.cakePage{padding:0;justify-content:flex-start;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#2a1a3a 0%,#120c1e 46%,#070510 100%)}
.cakeTop{width:100%;padding:40px 24px 0;opacity:0;transform:translateY(16px)}
.cakePage.show .cakeTop{animation:cakeIn 1s .25s ease forwards}
@keyframes cakeIn{to{opacity:1;transform:none}}
.cakeTop h2{margin:0;font-size:clamp(17px,4.9vw,23px);font-weight:600;color:#ffe4a8;letter-spacing:.09em;text-shadow:0 0 26px #ffbe5a55}
.cakeTop p{margin:10px 0 0;font-size:11px;color:#a79fb8;letter-spacing:.3em}
.cakeScene{position:relative;flex:1;width:100%;overflow:hidden}
.cakeGlow{position:absolute;left:50%;top:52%;width:min(120vw,620px);height:min(120vw,620px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffb84a26,transparent 62%);pointer-events:none}
.cakeCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.1s ease;pointer-events:auto;touch-action:none;cursor:grab}
.cakePage.show .cakeCanvas{opacity:1}
.cakePage.armed .cakeCanvas{cursor:grab}
.blowHint{position:absolute;left:50%;bottom:7%;transform:translate(-50%,14px);opacity:0;pointer-events:none;padding:13px 26px;border-radius:999px;background:#ffffff14;border:1px solid #ffd97a66;color:#ffe6ad;font-size:16px;letter-spacing:.14em;box-shadow:0 12px 40px #0008,0 0 40px #ffbe5a33;backdrop-filter:blur(8px);transition:opacity .6s ease,transform .6s ease;white-space:nowrap}
.blowHint.in{opacity:1;transform:translate(-50%,0);animation:hintPulse 2s ease-in-out infinite}
@keyframes hintPulse{50%{box-shadow:0 12px 40px #0008,0 0 60px #ffbe5a55}}

/* ===== 卡片页 ===== */
.cardsPage{padding:0;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#241736 0%,#0e0a18 52%,#06040d 100%)}
.cardsTitle{display:none}
.cardsWrap{position:relative;width:430px;height:336px;transform-origin:center center;opacity:0;transition:opacity .6s ease,filter .8s ease}
.cardsPage.show .cardsWrap{opacity:1}
.cardsWrap.dim{opacity:.3;filter:blur(2px)}
.card{position:absolute;width:82px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#fffdf5,#f6e2bd 60%,#eed3a4);border:1.5px solid #e6bb70;color:#7d2337;font-weight:800;font-size:16px;line-height:1;letter-spacing:1px;
  box-shadow:0 7px 16px #0008,inset 0 0 0 1px #fffdf8;opacity:0;transform:scale(.3) rotate(0deg);
  transition:opacity .45s ease,transform .55s cubic-bezier(.2,1.5,.42,1)}
.card.in{opacity:1;transform:scale(1) rotate(var(--rot))}
.bigCard{position:absolute;left:50%;top:50%;z-index:6;padding:26px 34px;border-radius:24px;
  background:linear-gradient(150deg,#fff3c4,#f9cb63 52%,#e29a34);color:#5b2410;font-size:clamp(28px,9vw,42px);font-weight:900;letter-spacing:.18em;
  border:2px solid #fff6d8;box-shadow:0 30px 90px #000b,0 0 70px #ffb64a55;
  opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg);transition:opacity .7s ease,transform .9s cubic-bezier(.2,1.5,.35,1)}
.bigCard.in{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg);animation:bigGlow 3s ease-in-out infinite 1s}
@keyframes bigGlow{50%{box-shadow:0 30px 90px #000b,0 0 110px #ffc25f88}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">

<section class="page active" id="p1"><div class="box"><div class="sub">先确认一下你的身份 👀</div><h1 class="title">你是否为蒙东阳本人？</h1><button class="choice" onclick="identity(true)">是</button><button class="choice" onclick="identity(false)">不是</button></div></section>

<section class="page" id="stop"><div class="box"><div class="stopTitle">终止访问</div><div class="stopText">检测到你不是蒙东阳本人。<br>本次祝福已终止。😶</div></div></section>

<section class="page" id="p2"><div class="box"><div class="sub">第二道认证 🔐</div><h1 class="title">你是否满18岁？</h1><button class="choice" onclick="adult(true)">是</button><button class="choice" onclick="adult(false)">不是</button></div></section>

<section class="page" id="stop2"><div class="box"><div class="stopTitle">终止访问</div><div class="stopText">未满18岁，无法继续领取这份神秘礼物。<br>祝你天天开心！</div></div></section>

<section class="page" id="p3"><div class="box"><div class="giftText">送你的一份礼物 🎁</div><div class="gift" onclick="openGift()"><div class="giftBase"></div><div class="ribbonV"></div><div class="giftLid"></div><div class="ribbonH"></div><div class="bowL"></div><div class="bowR"></div></div><div class="sub">点击礼盒打开</div></div></section>

<section class="page" id="p4"><div class="box"><div class="reveal">骗你的，其实什么也没有 😂</div><button class="choice delayBtn" onclick="go('p5')">太贱了，不理这个人了</button></div></section>

<section class="page" id="p5"><div class="box"><div class="reveal">不好意思，代码写错了 🤣</div><button class="choice" onclick="go('p6')">好</button></div></section>

<section class="page scrollPage" id="p6">
  <div class="birthday">祝你生日快乐 🎂</div>
  <div class="box" style="margin-bottom:20px"><div class="sub">往下滑</div><h2 style="color:#ffe18b;margin:10px 0;font-size:26px">送你 5 次机会</h2><div class="sub">每份奖励只能被转到一次</div></div>
  <div class="wheelWrap"><div class="pointer"></div><canvas id="wheel" width="900" height="900"></canvas><div class="center"><b id="count">5</b><small>次机会</small></div></div>
  <button class="spinBtn" id="spinBtn" onclick="spin()">开始转动</button>
</section>

<section class="page" id="prizePage"><div class="prize"><div id="prizeVisual"></div><h2 id="prizeTitle"></h2><p id="prizeText"></p><button class="choice" id="prizeBtn" onclick="nextAfterPrize()">好的</button></div></section>

<section class="page cakePage" id="cakePage">
  <div class="cakeTop"><h2>。事已至此，请你吃个蛋糕吧</h2></div>
  <div class="cakeScene" id="cakeScene">
    <div class="cakeGlow"></div>
    <canvas id="cakeCanvas" class="cakeCanvas"></canvas>
  </div>
  <div class="blowHint" id="blowHint">吹个蜡烛吧 🕯️</div>
</section>

<section class="page cardsPage" id="cardsPage">
  <div class="cardsWrap" id="cardsWrap"></div>
  <div class="bigCard" id="bigCard">生日快乐</div>
</section>

</div>
<script src="cake3d.js"></script>
<script>
/* ---------- 星空背景 ---------- */
const bg=document.getElementById('bg'),ctx=bg.getContext('2d');
let BW,BH,stars=[];
function resizeBg(){
  const d=devicePixelRatio||1;BW=innerWidth;BH=innerHeight;
  bg.width=BW*d;bg.height=BH*d;ctx.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:100},()=>({x:Math.random()*BW,y:Math.random()*BH,r:Math.random()*1.4+.2,a:Math.random()}));
}
function drawBg(){
  ctx.clearRect(0,0,BW,BH);
  const g=ctx.createRadialGradient(BW*.5,BH*.35,0,BW*.5,BH*.5,Math.max(BW,BH)*.8);
  g.addColorStop(0,'#21182e');g.addColorStop(1,'#080611');
  ctx.fillStyle=g;ctx.fillRect(0,0,BW,BH);
  for(const s of stars){
    s.a+=(Math.random()-.5)*.025;s.a=Math.max(.15,Math.min(1,s.a));
    ctx.globalAlpha=s.a;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;requestAnimationFrame(drawBg);
}
function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function identity(v){v?go('p2'):go('stop')}
function adult(v){v?go('p3'):go('stop2')}
function openGift(){burst();go('p4')}
function burst(){
  for(let i=0;i<22;i++){
    const s=document.createElement('div');s.className='spark';
    s.textContent=['✨','⭐','🎉','💫'][i%4];
    s.style.left='50%';s.style.top='45%';
    s.style.setProperty('--x',(Math.random()*300-150)+'px');
    s.style.setProperty('--y',(Math.random()*340-170)+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1300);
  }
}

/* ---------- 转盘 ---------- */
const items=[
  {id:2,type:'bag',text:'获得了建模脸，成为了全世界最好看的女生'},
  {id:3,type:'text',text:'谢谢惠顾'},
  {id:4,type:'text',text:'1000元红包'},
  {id:5,type:'bag',text:'恭喜你变胖了，胖了-10斤'},
  {id:6,type:'bag',text:'获得了一个红包，找hbq领取'}
];
const N=items.length,order=[2,4,3,5,6],used=new Set();
let spinsLeft=N,rotation=0,locked=false;
const wheel=document.getElementById('wheel'),wctx=wheel.getContext('2d');
const fills=['#a92950','#d48a36','#5f447d','#3f6b74','#8f4b68'];

function drawWheel(){
  const cx=450,cy=450,r=440,part=Math.PI*2/N;
  wctx.clearRect(0,0,900,900);
  for(let i=0;i<N;i++){
    const a=-Math.PI/2+i*part,it=items[i],dead=used.has(it.id)&&it.id!==3;
    wctx.beginPath();wctx.moveTo(cx,cy);wctx.arc(cx,cy,r,a,a+part);wctx.closePath();
    wctx.fillStyle=dead?'#312a3b':fills[i%fills.length];wctx.fill();
    wctx.strokeStyle=dead?'#5a5266':'#f7dc8b';wctx.lineWidth=7;wctx.stroke();

    wctx.save();wctx.translate(cx,cy);wctx.rotate(a+part/2);
    wctx.textAlign='center';
    if(dead){
      wctx.fillStyle='#7d738f';wctx.font='bold 40px sans-serif';wctx.fillText('✓',247,16);
      wctx.font='bold 18px sans-serif';wctx.fillText('已领取',247,48);
    }else if(it.type==='bag'){
      wctx.font='42px serif';wctx.fillText('🧧',250,4);
      wctx.font='bold 21px sans-serif';wctx.fillStyle='#fff4cf';wctx.fillText('福袋',250,40);
    }else{
      wctx.fillStyle='#fff4cf';wctx.font='bold 24px sans-serif';
      wctx.fillText(it.id===4?'1000元红包':'谢谢惠顾',250,10);
    }
    wctx.restore();
  }
}
drawWheel();

function spin(){
  if(locked||spinsLeft<=0)return;
  locked=true;
  const targetId=order[N-spinsLeft];
  const ti=items.findIndex(x=>x.id===targetId),part=360/N;
  const targetAngle=360-(ti*part+part/2),current=rotation%360;
  let delta=(targetAngle-current+360)%360;
  if(delta<15)delta+=360;
  rotation+=360*5+delta;
  wheel.style.transform='rotate('+rotation+'deg)';
  setTimeout(()=>{
    used.add(targetId);spinsLeft--;
    document.getElementById('count').textContent=spinsLeft;
    if(spinsLeft<=0)document.getElementById('spinBtn').disabled=true;
    drawWheel();
    showPrize(targetId,spinsLeft<=0);
    locked=false;
  },1750);
}

function showPrize(id,isLast){
  const it=items.find(x=>x.id===id);
  const visual=document.getElementById('prizeVisual');
  const title=document.getElementById('prizeTitle');
  const text=document.getElementById('prizeText');
  if(id===4){visual.innerHTML='<div style="font-size:70px;margin:8px">💨</div>';title.textContent='很遗憾';text.textContent='由于你长得太可爱，红包跑了'}
  else if(it.type==='bag'){visual.innerHTML='<div class="luckybag"><div class="bagBody">🧧</div><div class="bagTop"></div></div>';title.textContent='恭喜你！';text.textContent=it.text}
  else{visual.innerHTML='<div style="font-size:62px;margin:10px">🎊</div>';title.textContent='结果揭晓';text.textContent=it.text}
  document.getElementById('prizePage').dataset.next=isLast?'cakePage':'p6';
  go('prizePage');
}
function nextAfterPrize(){
  const next=document.getElementById('prizePage').dataset.next;
  if(next==='cakePage')enterCake();else go(next);
}

/* ---------- 蛋糕页控制 ---------- */
let cakeTimer=null,armed=false,blown=false,cardsBuilt=false;

function loadThree(cb){
  if(window.THREE){cb();return;}
  window.__threeQ=window.__threeQ||[];
  window.__threeQ.push(cb);
  if(window.__threeLoading)return;
  window.__threeLoading=true;
  var srcs=['https://registry.npmmirror.com/three/0.159.0/files/build/three.min.js','three.min.js'];
  var i=0;
  function next(){
    if(i>=srcs.length){window.__threeLoading=false;return;}
    var s=document.createElement('script');
    s.src=srcs[i++];
    s.onload=function(){
      if(!window.THREE){next();return;}
      var q=window.__threeQ;window.__threeQ=[];
      for(var k=0;k<q.length;k++)q[k]();
    };
    s.onerror=function(){next();};
    document.head.appendChild(s);
  }
  next();
}

function enterCake(){
  loadThree(function(){if(window.Cake3D)window.Cake3D.build();});
  go('cakePage');
  document.getElementById('cakePage').classList.add('show');
  clearTimeout(cakeTimer);
  cakeTimer=setTimeout(function(){
    armed=true;
    document.getElementById('cakePage').classList.add('armed');
    if(window.Cake3D)window.Cake3D.arm();
    document.getElementById('blowHint').classList.add('in');
  },6200);
}

function blowCandle(){
  if(!armed||blown)return;
  blown=true;
  document.getElementById('cakePage').classList.add('blowing');
  if(window.Cake3D)window.Cake3D.blow();
  document.getElementById('blowHint').classList.remove('in');
  setTimeout(function(){
    document.getElementById('blowHint').textContent='呼—— 吹灭了 🎉';
  },420);
  setTimeout(enterCards,1800);
}

/* ---------- 卡片 ---------- */
const BLESSINGS=['平安喜乐','万事胜意','前程似锦','得偿所愿','岁岁常欢','喜乐长安','风华永驻','心想事成','好运常伴','岁岁无忧',
  '熠熠生辉','乘风破浪','未来可期','自在如风','光芒万丈','扶摇直上','不负韶华','岁岁欢愉'];
/* 坐标 [列,行] —— 18 张卡片拼成 "18"（1 是一根直线） */
const CELLS=[];
for(let r=0;r<7;r++)CELLS.push([0,r]);
[[3,0],[2,1],[4,1],[2,2],[4,2],[3,3],[2,4],[4,4],[2,5],[4,5],[3,6]].forEach(function(c){CELLS.push(c);});
const PITCH_X=86,PITCH_Y=48;

function fitCards(){
  const w=Math.min(innerWidth-24,520);
  const h=innerHeight-150;
  const s=Math.max(.4,Math.min(w/430,h/336,1.2));
  document.getElementById('cardsWrap').style.transform='scale('+s.toFixed(3)+')';
}

function enterCards(){
  if(!cardsBuilt){
    cardsBuilt=true;
    const wrap=document.getElementById('cardsWrap');
    for(let i=0;i<CELLS.length;i++){
      const c=CELLS[i];
      const card=document.createElement('div');
      card.className='card';
      card.style.cssText='left:'+(c[0]*PITCH_X+2)+'px;top:'+(c[1]*PITCH_Y+3)+'px;--rot:'+(((i*37)%11)-5)+'deg';
      const word=BLESSINGS[i]||'生日快乐';
      card.innerHTML='<span>'+word[0]+'</span><span>'+word[1]+'</span><span>'+word[2]+'</span><span>'+word[3]+'</span>';
      wrap.appendChild(card);
    }
  }
  go('cardsPage');
  document.getElementById('cardsPage').classList.add('show');
  fitCards();
  const cards=Array.prototype.slice.call(document.querySelectorAll('#cardsWrap .card'));
  cards.forEach(function(c,i){setTimeout(function(){c.classList.add('in');},380+i*95);});
  const total=380+cards.length*95;
  setTimeout(function(){
    document.getElementById('cardsWrap').classList.add('dim');
    document.getElementById('bigCard').classList.add('in');
    burst();
    setTimeout(burst,650);
  },total+950);
}

addEventListener('resize',function(){resizeBg();fitCards();});
resizeBg();drawBg();
</script>
</body>
</html>
